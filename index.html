<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF7EE" />
    <meta name="description" content="AptiCrack: a 12-week aptitude preparation tracker for campus placements and SDE assessments." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet" />
    <title>AptiCrack: aptitude prep tracker</title>
    <script>
      // Apply saved theme before first paint so there is no light/dark flash.
      try {
        var s = (JSON.parse(localStorage.getItem('apticrack.v1')) || {}).settings || {};
        var dark = s.mode === 'dark' || (s.mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        if (s.accent) document.documentElement.dataset.accent = s.accent;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AptiCrack needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
